<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./css2" rel="stylesheet">
<style>
:root{
  --tile:#D6EFE3; --grout:#C2E3D2; --paper:#FFFFFF; --zone:#F2FAF6;
  --ink:#1E2A4A; --muted:#5A6788; --line:#1E2A4A; --shadow:#1E2A4A;
  --tomato:#E0412B; --mustard:#F2B632; --basil:#2E8B57; --sky:#3D6FD6;
  --ok-bg:#E4F5EB; --bad-bg:#FCE7E3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tile:#15223A; --grout:#1C2C49; --paper:#1F2D4B; --zone:#182640;
    --ink:#EEF2FA; --muted:#A9B4CF; --line:#0A1120; --shadow:#0A1120;
    --tomato:#F05A43; --mustard:#F5C24E; --basil:#43B97F; --sky:#5F8FEF;
    --ok-bg:#1B3B33; --bad-bg:#43262A;
  }
}
:root[data-theme="dark"]{
  --tile:#15223A; --grout:#1C2C49; --paper:#1F2D4B; --zone:#182640;
  --ink:#EEF2FA; --muted:#A9B4CF; --line:#0A1120; --shadow:#0A1120;
  --tomato:#F05A43; --mustard:#F5C24E; --basil:#43B97F; --sky:#5F8FEF;
  --ok-bg:#1B3B33; --bad-bg:#43262A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{
  margin:0; min-height:100%;
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background-color:var(--tile);
  background-image:
    linear-gradient(var(--grout) 2px, transparent 2px),
    linear-gradient(90deg, var(--grout) 2px, transparent 2px);
  background-size:56px 32px;
}
.app{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.logo{
  font-family:'Shrikhand','Georgia',serif;font-size:clamp(1.6rem,5vw,2.2rem);
  color:var(--tomato);margin:0;line-height:1.1;
  text-shadow:2px 2px 0 var(--shadow);
}
.score{
  background:var(--paper);border:3px solid var(--line);border-radius:999px;
  padding:6px 16px;font-weight:700;font-size:1.1rem;box-shadow:3px 3px 0 var(--shadow);
  white-space:nowrap;
}
.score.bump{animation:bump .4s ease}
@keyframes bump{50%{transform:scale(1.18)}}

.card{
  background:var(--paper);border:3px solid var(--line);border-radius:20px;
  box-shadow:6px 6px 0 var(--shadow);padding:clamp(18px,4vw,28px);
}
.center{text-align:center}
h2{font-family:'Shrikhand','Georgia',serif;font-weight:400;font-size:clamp(1.6rem,5vw,2rem);margin:6px 0 10px;color:var(--ink)}
p{line-height:1.5;margin:0 0 12px;max-width:62ch}
.center p{margin-left:auto;margin-right:auto}
.round-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.round-label{font-weight:700;color:var(--muted)}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--zone)}
.dot.done{background:var(--basil)}
.dot.now{background:var(--mustard)}
.prompt{display:flex;align-items:center;gap:12px;font-size:1.1rem;font-weight:600}
.big-emoji{font-size:2.2rem;line-height:1}
.hero-emoji{font-size:3.6rem;line-height:1}

.zone{
  min-height:76px;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;
  gap:10px;align-items:center;margin-bottom:14px;transition:background .2s,border-color .2s;
}
.zone.answer{border:3px dashed var(--muted);background:var(--zone)}
.zone.bank{border:3px solid transparent}
.zone.is-empty::before{content:attr(data-empty);color:var(--muted);font-weight:600;padding-left:6px}
.zone.correct{border-style:solid;border-color:var(--basil);background:var(--ok-bg)}

.word{
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  font:600 1.15rem 'Outfit',system-ui,sans-serif;padding:10px 16px;
  border:3px solid var(--line);border-radius:10px;box-shadow:3px 3px 0 var(--shadow);
  background:var(--c);color:var(--ct);transform:rotate(var(--r));
}
.word:focus-visible,.btn:focus-visible,.arrow:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.locked .word{cursor:default}
.placeholder{opacity:.2}
.ghost{position:fixed;pointer-events:none;z-index:50;margin:0;cursor:grabbing;transform:rotate(-3deg) scale(1.06)}

.steps{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:10px;counter-reset:s}
.step{
  counter-increment:s;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  display:flex;align-items:center;gap:12px;background:var(--zone);
  border:3px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;
  box-shadow:3px 3px 0 var(--shadow);font-size:1.05rem;line-height:1.35;
}
.step .num{
  flex:none;width:32px;height:32px;border-radius:50%;background:var(--mustard);color:#1E2A4A;
  border:2px solid var(--line);display:grid;place-items:center;font-weight:700;
}
.step .num::before{content:counter(s)}
.step .txt{flex:1}
.step.right{border-color:var(--basil);background:var(--ok-bg)}
.step.wrong{border-color:var(--tomato);background:var(--bad-bg)}
.step.ghost{width:auto}
.arrows{display:flex;flex-direction:column;gap:4px;flex:none}
.arrow{
  width:34px;height:28px;border:2px solid var(--line);border-radius:8px;background:var(--paper);
  color:var(--ink);font-size:.8rem;cursor:pointer;padding:0;
}
.locked .step{cursor:default}
.locked .arrow{visibility:hidden}

.msg{min-height:1.6em;font-weight:600;font-size:1.05rem}
.msg.ok{color:var(--basil)}
.msg.bad{color:var(--tomato)}
.tip{background:var(--zone);border:2px dashed var(--muted);border-radius:12px;padding:12px 14px;text-align:left}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.center .actions{justify-content:center}
.btn{
  font:700 1.05rem 'Outfit',system-ui,sans-serif;padding:12px 22px;border-radius:12px;
  border:3px solid var(--line);background:var(--tomato);color:#fff;cursor:pointer;
  box-shadow:4px 4px 0 var(--shadow);transition:transform .1s,box-shadow .1s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn.secondary{background:var(--paper);color:var(--ink)}
.rank{font-family:'Shrikhand','Georgia',serif;font-size:clamp(2rem,7vw,2.8rem);color:var(--tomato);margin:4px 0}
.final{font-size:1.2rem;font-weight:700}
.how{text-align:left;display:grid;gap:10px;margin:0 auto 18px;max-width:460px}
.how div{display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.how span{font-size:1.5rem;line-height:1.1}

.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.burst-bit{position:fixed;pointer-events:none;z-index:60;font-size:1.7rem;transform:translate(-50%,-50%);animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.6);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .shake,.score.bump,.burst-bit{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<main class="app">
  <header class="bar">
    <h1 class="logo">Kitchen Challenge</h1>
    <div class="score" id="scoreBox" aria-live="polite">🥄 <span id="score">0</span> pts</div>
  </header>
  <section id="screen">
  <div class="card center">
    <div class="hero-emoji">👩‍🍳</div>
    <h2>Ready to cook?</h2>
    <p>Two quick rounds to practise the passive voice.</p>
    <div class="how">
      <div><span>🍕</span><div><strong>Round 1:</strong> drag the words to build a passive sentence.</div></div>
      <div><span>🍳</span><div><strong>Round 2:</strong> drag the recipe steps into the right order.</div></div>
      <div><span>⭐</span><div>Get it right the first time for bonus points. You can also tap words instead of dragging.</div></div>
    </div>
    <div class="actions"><button class="btn" id="go">Start round 1</button></div>
  </div></section>
</main>

<script>
const S1 = [
  {emoji:'🍕', order:['pizza','is','baked','in','an oven'], answers:['pizza is baked in an oven']},
  {emoji:'☕', order:['coffee','is','grown','in','Brazil'], answers:['coffee is grown in brazil','in brazil coffee is grown']},
  {emoji:'🍲', order:['this dish','was','invented','in the','1800s'], answers:['this dish was invented in the 1800s','in the 1800s this dish was invented']},
  {emoji:'🥣', order:['this','soup','should','be','eaten','hot'], answers:['this soup should be eaten hot']},
  {emoji:'🍣', order:['sushi','is','eaten','with','chopsticks'], answers:['sushi is eaten with chopsticks']}
];
const STEPS = [
  'First, the eggs are cracked into a bowl.',
  'Then, they\u2019re mixed with milk and a pinch of salt.',
  'While the pan is heating, the cheese is grated.',
  'Once the pan is hot, the eggs are poured in.',
  'After that, the cheese is added on top.',
  'Finally, the omelette is folded and served hot.'
];
const COLORS = [['var(--tomato)','#fff'],['var(--mustard)','#1E2A4A'],['var(--sky)','#fff'],['var(--basil)','#fff']];
const MAX = S1.length*15 + STEPS.length*10 + 20;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const screen = document.getElementById('screen');
const scoreEl = document.getElementById('score');
const scoreBox = document.getElementById('scoreBox');
let score = 0, r1i = 0;

function addScore(n){
  if(!n) return;
  score += n; scoreEl.textContent = score;
  scoreBox.classList.remove('bump'); void scoreBox.offsetWidth; scoreBox.classList.add('bump');
}
function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function shuffledNot(a){ let b; do{ b=shuffle(a); } while(b.every((x,i)=>x===a[i])); return b; }
function sentence(words){ const s=words.join(' '); return s.charAt(0).toUpperCase()+s.slice(1)+'.'; }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function burst(emoji, target){
  if(reduced) return;
  const r = target.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const pool = [emoji, emoji, '\u2728', '\u2B50'];
  for(let i=0;i<12;i++){
    const s = document.createElement('span');
    s.className = 'burst-bit';
    s.textContent = pool[i % pool.length];
    s.style.left = cx+'px'; s.style.top = cy+'px';
    s.style.setProperty('--dx', (Math.random()*300-150)+'px');
    s.style.setProperty('--dy', (-40 - Math.random()*140)+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 950);
  }
}

/* ---------- drag engine (mouse + touch) ---------- */
let drag = null;
function enableDrag(el, cfg){
  el.addEventListener('pointerdown', e=>{
    if(cfg.isLocked()) return;
    if(e.target.closest('.arrow')) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    const r = el.getBoundingClientRect();
    drag = {el, cfg, sx:e.clientX, sy:e.clientY, ox:e.clientX-r.left, oy:e.clientY-r.top, w:r.width, started:false, ghost:null};
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', endDrag);
  });
}
function onMove(e){
  const d = drag; if(!d) return;
  if(!d.started){
    if(Math.hypot(e.clientX-d.sx, e.clientY-d.sy) < 6) return;
    d.started = true;
    const g = d.el.cloneNode(true);
    g.classList.add('ghost'); g.style.width = d.w+'px';
    document.body.appendChild(g); d.ghost = g;
    d.el.classList.add('placeholder');
  }
  e.preventDefault();
  d.ghost.style.left = (e.clientX-d.ox)+'px';
  d.ghost.style.top = (e.clientY-d.oy)+'px';
  for(const z of d.cfg.zones()){
    const r = z.getBoundingClientRect();
    if(e.clientX>=r.left-16 && e.clientX<=r.right+16 && e.clientY>=r.top-16 && e.clientY<=r.bottom+16){
      placeInZone(z, d.el, e.clientX, e.clientY, d.cfg.axis);
      d.cfg.onChange();
      break;
    }
  }
}
function placeInZone(z, el, x, y, axis){
  const kids = [...z.children].filter(k=>k!==el && k.classList.contains('drag-item'));
  let before = null;
  for(const k of kids){
    const r = k.getBoundingClientRect();
    if(axis==='y'){ if(y < r.top + r.height/2){ before=k; break; } }
    else{
      if(y < r.top){ before=k; break; }
      if(y <= r.bottom && x < r.left + r.width/2){ before=k; break; }
    }
  }
  if(before){ if(el.nextElementSibling!==before || el.parentElement!==z) z.insertBefore(el, before); }
  else if(z.lastElementChild!==el || el.parentElement!==z) z.appendChild(el);
}
function onUp(){
  const d = drag; endDrag();
  if(d && d.started){ d.el._justDragged = true; setTimeout(()=>{ d.el._justDragged=false; }, 60); }
}
function endDrag(){
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', endDrag);
  if(drag){ if(drag.ghost) drag.ghost.remove(); drag.el.classList.remove('placeholder'); }
  drag = null;
}

/* ---------- screens ---------- */
function renderStart(){
  score = 0; r1i = 0; scoreEl.textContent = 0;
  screen.innerHTML = `
  <div class="card center">
    <div class="hero-emoji">👩‍🍳</div>
    <h2>Ready to cook?</h2>
    <p>Two quick rounds to practise the passive voice.</p>
    <div class="how">
      <div><span>🍕</span><div><strong>Round 1:</strong> drag the words to build a passive sentence.</div></div>
      <div><span>🍳</span><div><strong>Round 2:</strong> drag the recipe steps into the right order.</div></div>
      <div><span>⭐</span><div>Get it right the first time for bonus points. You can also tap words instead of dragging.</div></div>
    </div>
    <div class="actions"><button class="btn" id="go">Start round 1</button></div>
  </div>`;
  document.getElementById('go').onclick = ()=>renderR1();
}

function renderR1(){
  const item = S1[r1i];
  let attempts = 0, locked = false, revealed = false;
  screen.innerHTML = `
  <div class="card" id="card">
    <div class="round-head">
      <span class="round-label">Round 1 of 2: Sentence builder</span>
      <div class="dots" aria-label="Sentence ${r1i+1} of ${S1.length}">${S1.map((_,i)=>`<span class="dot ${i<r1i?'done':''} ${i===r1i?'now':''}"></span>`).join('')}</div>
    </div>
    <p class="prompt"><span class="big-emoji" aria-hidden="true">${item.emoji}</span>Put the words in order to make a passive sentence.</p>
    <div class="zone answer is-empty" id="answer" data-empty="Drag words here"></div>
    <div class="zone bank" id="bank"></div>
    <p class="msg" id="msg" role="status"></p>
    <div class="actions">
      <button class="btn secondary" id="reveal" hidden>Show answer</button>
      <button class="btn" id="check">Check</button>
    </div>
  </div>`;
  const card = document.getElementById('card');
  const answer = document.getElementById('answer');
  const bank = document.getElementById('bank');
  const msg = document.getElementById('msg');
  const checkBtn = document.getElementById('check');
  const revealBtn = document.getElementById('reveal');

  const refresh = ()=>{
    answer.classList.toggle('is-empty', answer.children.length===0);
    if(!locked){ msg.textContent=''; msg.className='msg'; }
  };
  const cfg = {
    zones: ()=>[answer, bank], axis:'x', isLocked: ()=>locked, onChange: refresh
  };
  shuffledNot(item.order).forEach((w,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'word drag-item';
    b.textContent = w; b.dataset.w = w;
    const [c,ct] = COLORS[i % COLORS.length];
    b.style.setProperty('--c', c); b.style.setProperty('--ct', ct);
    b.style.setProperty('--r', (Math.random()*6-3).toFixed(1)+'deg');
    b.addEventListener('click', ()=>{
      if(locked || b._justDragged) return;
      (b.parentElement===bank ? answer : bank).appendChild(b);
      refresh();
    });
    enableDrag(b, cfg);
    bank.appendChild(b);
  });

  const finish = (text)=>{
    locked = true; card.classList.add('locked');
    answer.classList.add('correct');
    revealBtn.hidden = true;
    msg.className = 'msg ok'; msg.textContent = text;
    checkBtn.textContent = r1i < S1.length-1 ? 'Next sentence' : 'Finish round 1';
  };

  checkBtn.onclick = ()=>{
    if(locked){
      r1i++;
      if(r1i < S1.length) renderR1(); else renderR1Done();
      return;
    }
    if(bank.children.length){
      msg.className='msg bad'; msg.textContent='Use all the words first.'; shake(bank); return;
    }
    const words = [...answer.children].map(t=>t.dataset.w);
    if(item.answers.includes(words.join(' ').toLowerCase())){
      const pts = attempts===0 ? 15 : 10;
      addScore(pts);
      burst(item.emoji, answer);
      finish(`Correct! "${sentence(words)}" +${pts} points`);
    } else {
      attempts++;
      shake(answer);
      msg.className='msg bad';
      msg.textContent = attempts===1 ? 'Not quite. Try moving the words around.' : 'Still not right. Try again, or show the answer.';
      if(attempts>=2) revealBtn.hidden = false;
    }
  };
  revealBtn.onclick = ()=>{
    revealed = true;
    const tiles = [...answer.children, ...bank.children];
    item.order.forEach(w=>{
      const t = tiles.find(x=>x.dataset.w===w && !x._used);
      t._used = true; answer.appendChild(t);
    });
    answer.classList.remove('is-empty');
    finish(`Here's the answer: "${sentence(item.order)}" Read it out loud.`);
  };
}

function renderR1Done(){
  screen.innerHTML = `
  <div class="card center">
    <div class="hero-emoji">🎉</div>
    <h2>Round 1 done</h2>
    <p>You have <strong>${score}</strong> points so far.</p>
    <p class="tip">🗣️ <strong>Speaking time:</strong> read one of the sentences out loud. Then make your own passive sentence about a dish you love.</p>
    <div class="actions"><button class="btn" id="go">Start round 2</button></div>
  </div>`;
  document.getElementById('go').onclick = ()=>renderR2();
}

function renderR2(){
  let checks = 0, locked = false, scored = false;
  screen.innerHTML = `
  <div class="card" id="card">
    <div class="round-head">
      <span class="round-label">Round 2 of 2: Recipe in order</span>
    </div>
    <p class="prompt"><span class="big-emoji" aria-hidden="true">🍳</span>How do you make a cheese omelette? Drag the steps into the right order.</p>
    <ol class="steps" id="steps"></ol>
    <p class="msg" id="msg" role="status"></p>
    <div class="actions">
      <button class="btn secondary" id="reveal" hidden>Show answer</button>
      <button class="btn" id="check">Check</button>
    </div>
  </div>`;
  const card = document.getElementById('card');
  const list = document.getElementById('steps');
  const msg = document.getElementById('msg');
  const checkBtn = document.getElementById('check');
  const revealBtn = document.getElementById('reveal');

  const clearMarks = ()=>{
    if(locked) return;
    list.querySelectorAll('.step').forEach(s=>s.classList.remove('right','wrong'));
    msg.textContent=''; msg.className='msg';
  };
  const cfg = { zones: ()=>[list], axis:'y', isLocked: ()=>locked, onChange: clearMarks };

  const idx = STEPS.map((_,i)=>i);
  shuffledNot(idx).forEach(i=>{
    const li = document.createElement('li');
    li.className = 'step drag-item';
    li.dataset.i = i;
    li.innerHTML = `<span class="num" aria-hidden="true"></span><span class="txt">${STEPS[i]}</span>
      <span class="arrows">
        <button type="button" class="arrow" data-dir="-1" aria-label="Move step up">▲</button>
        <button type="button" class="arrow" data-dir="1" aria-label="Move step down">▼</button>
      </span>`;
    li.querySelectorAll('.arrow').forEach(a=>a.addEventListener('click', ()=>{
      if(locked) return;
      if(a.dataset.dir==='-1' && li.previousElementSibling) list.insertBefore(li, li.previousElementSibling);
      if(a.dataset.dir==='1' && li.nextElementSibling) list.insertBefore(li.nextElementSibling, li);
      clearMarks(); a.focus();
    }));
    enableDrag(li, cfg);
    list.appendChild(li);
  });

  const finish = (text)=>{
    locked = true; card.classList.add('locked');
    revealBtn.hidden = true;
    msg.className='msg ok'; msg.textContent = text;
    checkBtn.textContent = 'See my results';
  };

  checkBtn.onclick = ()=>{
    if(locked){ renderEnd(); return; }
    const items = [...list.children];
    let right = 0;
    items.forEach((li,pos)=>{
      const ok = Number(li.dataset.i)===pos;
      if(ok) right++;
      li.classList.toggle('right', ok); li.classList.toggle('wrong', !ok);
    });
    const all = right===STEPS.length;
    if(!scored){
      scored = true;
      addScore(right*10 + (all ? 20 : 0));
    }
    if(all){
      burst('🍳', list);
      finish(checks===0 ? `Perfect order! +${STEPS.length*10+20} points` : 'All steps are in the right order now!');
    } else {
      checks++;
      shake(list);
      msg.className='msg bad';
      msg.textContent = `${right} of ${STEPS.length} steps are in the right place. Move the red ones and check again.`;
      if(checks>=2) revealBtn.hidden = false;
    }
  };
  revealBtn.onclick = ()=>{
    [...list.children].sort((a,b)=>a.dataset.i-b.dataset.i).forEach(li=>{
      li.classList.remove('wrong'); li.classList.add('right'); list.appendChild(li);
    });
    finish("Here's the right order. Read the whole recipe out loud.");
  };
}

function renderEnd(){
  let rank, emoji, note;
  if(score >= 120){ rank='Master Chef'; emoji='🏆'; note='Amazing! Your passive sentences are restaurant quality.'; }
  else if(score >= 60){ rank='Home Cook'; emoji='🍳'; note='Nice work! A little more practice and you\u2019ll be a Master Chef.'; }
  else { rank='Kitchen Helper'; emoji='🥄'; note='Good start! Play again and try to beat your score.'; }
  screen.innerHTML = `
  <div class="card center">
    <div class="hero-emoji">${emoji}</div>
    <p style="margin-bottom:0">Your chef rank</p>
    <div class="rank">${rank}</div>
    <p class="final">${score} / ${MAX} points</p>
    <p>${note}</p>
    <p class="tip">🗣️ <strong>Speaking time:</strong> explain how your favourite family dish is made. Use <em>first, then, once, while, after that</em> and the passive.</p>
    <div class="actions"><button class="btn" id="again">Play again</button></div>
  </div>`;
  if(score >= 120) burst('🏆', document.querySelector('.rank'));
  document.getElementById('again').onclick = renderStart;
}

renderStart();
</script>
